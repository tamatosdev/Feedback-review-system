<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#FFF000', brandDark: '#CCBF00', ink: '#111827' }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-white text-ink antialiased flex items-center justify-center px-4">

  <main class="w-full max-w-md">
    <div class="flex flex-col items-center mb-6">
      <img src="/assets/logo.png" alt="Logo" class="w-[170px] h-[60px] object-contain drop-shadow-sm" />
      <h1 class="mt-3 text-2xl font-extrabold tracking-tight">Admin Sign In</h1>
      <p class="text-sm text-gray-500 mt-1">Internal access only</p>
    </div>

    <form id="loginForm" class="bg-white border-2 border-brand rounded-3xl shadow-lg p-6 sm:p-8 space-y-5">
      <div>
        <label for="username" class="block text-sm font-bold mb-1.5">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required placeholder="Enter username"
          class="w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand" />
      </div>
      <div>
        <label for="password" class="block text-sm font-bold mb-1.5">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password"
          class="w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand" />
      </div>
      <button type="submit" id="signInBtn"
        class="w-full bg-brand hover:bg-brandDark text-ink font-extrabold rounded-xl py-3.5 text-base transition shadow-sm active:scale-[.99] disabled:opacity-60 disabled:cursor-not-allowed">
        Sign In
      </button>
      <p id="loginError" class="hidden text-sm font-semibold text-red-600 text-center"></p>
    </form>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = $('loginError');
      const btn = $('signInBtn');
      errorEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: $('username').value.trim(), password: $('password').value })
        });
        const json = await res.json();
        if (!res.ok || !json.ok) throw new Error(json.error || 'Invalid credentials.');
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        $('password').value = '';
        $('password').focus();
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
